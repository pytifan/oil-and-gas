services:
  python-calculator:
    build: ./python-service
    container_name: calculations-python
    ports:
      - "50051:50051"
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  calculations-gateway:
    build: .
    container_name: calculations-gateway
    ports:
      - "8080:8080"
    environment:
      - GRPC_CLIENT_PYTHON_CALCULATOR_ADDRESS=python-calculator:50051
    depends_on:
      python-calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: calculations-ui
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api/v1/calculations
      - REACT_APP_WS_URL=http://localhost:8080/ws
    depends_on:
      calculations-gateway:
        condition: service_healthy
